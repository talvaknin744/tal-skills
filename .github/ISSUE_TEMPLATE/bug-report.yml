name: Bug report
description: Report a reproducible problem with a skill, agent, workflow, or installer.
title: "bug: "
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: Name the skill, agent, workflow, or installer involved.
      placeholder: e.g. temporal-workflows
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the relevant error text.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the host, versions, and minimal steps needed to reproduce.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links or sanitized examples. Remove credentials and personal data.
