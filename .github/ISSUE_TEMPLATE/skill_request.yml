name: Skill request
description: Propose a reusable skill capability.
title: "skill: "
labels: [enhancement]
body:
  - type: textarea
    id: capability
    attributes:
      label: Capability
      description: What reusable task should the skill help with?
    validations:
      required: true
  - type: textarea
    id: triggers
    attributes:
      label: Example requests
      description: Give positive requests that should activate it and nearby requests that should not.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow and boundaries
      description: Describe the expected steps, outputs, and important limits.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Examples or references
      description: Link relevant sources or sanitized examples.
