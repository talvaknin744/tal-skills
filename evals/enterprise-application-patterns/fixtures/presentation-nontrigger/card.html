<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      .card { width: 300px; padding: 24px; border: 1px solid #ccc; }
      .card-title { font-size: 20px; }
      .card-actions { display: flex; justify-content: flex-start; gap: 8px; }
    </style>
  </head>
  <body>
    <article class="card">
      <h2 class="card-title">Recent notes</h2>
      <p>This static sample has no data loading or event handlers.</p>
      <div class="card-actions"><button>Archive</button><button>Open</button></div>
    </article>
  </body>
</html>
